<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lockhart Capital Improvement Plan · Project Viewer (Beta)</title>
<link rel="stylesheet" href="https://js.arcgis.com/4.31/esri/themes/light/main.css">
<script src="https://js.arcgis.com/4.31/"></script>
<style>
  :root {
    --glass: rgba(14, 20, 27, 0.74);
    --ink: #f4f6f8;
    --muted: #b9c2cc;
    --accent: #3fa9f5;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  #map { position: absolute; inset: 0; }

  header.bar {
    position: absolute; top: 12px; left: 12px; z-index: 5;
    background: #fff; border-radius: 10px; padding: 10px 14px;
    box-shadow: 0 2px 10px rgba(0,0,0,.18); max-width: calc(100% - 24px);
  }
  header.bar h1 { margin: 0; font-size: 17px; }
  header.bar p { margin: 2px 0 0; font-size: 13px; color: #555; }

  /* Site view: street view fills the screen, project card sits in front */
  #site { position: fixed; inset: 0; z-index: 20; display: none; background: #111; }
  #site.open { display: block; }
  #sv { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  #sv-missing {
    position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
    color: var(--muted); font-size: 15px; text-align: center; padding: 24px;
  }
  /* Dim the street view slightly behind the card so the text stays readable */
  #shade {
    position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(90deg, rgba(0,0,0,.45) 0%, rgba(0,0,0,.15) 45%, rgba(0,0,0,0) 70%);
    transition: opacity .25s;
  }
  #site.focus #shade { opacity: 0; }

  #card {
    position: absolute; left: 20px; top: 20px; bottom: 20px; width: min(420px, calc(100% - 40px));
    overflow: auto; color: var(--ink); background: var(--glass);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
    border-radius: 14px; padding: 20px 22px; box-shadow: 0 8px 30px rgba(0,0,0,.35);
    transition: transform .3s ease, opacity .3s ease;
  }
  #site.focus #card { transform: translateX(calc(-100% - 40px)); opacity: 0; pointer-events: none; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .chip { font-size: 12px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.14); }
  .chip.id { background: var(--accent); color: #04121f; font-weight: 600; }
  #card h2 { margin: 4px 0 8px; font-size: 22px; line-height: 1.25; }
  #card .desc { font-size: 15px; line-height: 1.5; margin: 0 0 16px; }
  dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 14px; margin: 0 0 16px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-weight: 600; }
  .note { font-size: 12.5px; color: var(--muted); border-top: 1px solid rgba(255,255,255,.15); padding-top: 10px; }

  .controls { position: absolute; right: 20px; top: 20px; display: flex; gap: 8px; z-index: 2; }
  button.ctl, a.ctl {
    font: inherit; font-size: 14px; border: 0; cursor: pointer; text-decoration: none;
    color: var(--ink); background: var(--glass); padding: 9px 14px; border-radius: 999px;
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); box-shadow: 0 2px 10px rgba(0,0,0,.3);
  }
  button.ctl:hover, a.ctl:hover { background: rgba(14,20,27,.9); }
  button.ctl:focus-visible, a.ctl:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 640px) {
    #card { top: auto; height: 55%; }
    .controls { left: 20px; right: 20px; flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div id="map"></div>
<header class="bar">
  <h1>Lockhart Capital Improvement Plan</h1>
  <p>Beta · Click a project to see its site. Locations are approximate.</p>
</header>

<section id="site" aria-label="Project site view" aria-hidden="true">
  <iframe id="sv" title="Street view of the project site" loading="lazy" allowfullscreen
          referrerpolicy="no-referrer-when-downgrade"></iframe>
  <div id="sv-missing"></div>
  <div id="shade"></div>

  <div class="controls">
    <button class="ctl" id="btn-focus" type="button" aria-pressed="false">Focus street view</button>
    <a class="ctl" id="btn-gmaps" target="_blank" rel="noopener">Open in Google Maps</a>
    <button class="ctl" id="btn-close" type="button">Back to map</button>
  </div>

  <article id="card" aria-live="polite">
    <div class="chips"><span class="chip id" id="c-id"></span><span class="chip" id="c-system"></span><span class="chip" id="c-status"></span></div>
    <h2 id="c-title"></h2>
    <p class="desc" id="c-desc"></p>
    <dl id="c-facts"></dl>
    <p class="note" id="c-note"></p>
  </article>
</section>

<script>
/* ---------------------------------------------------------------- settings */
// Paste your Google Maps Embed API key here (free, unlimited for the Embed API).
// Restrict it in Google Cloud to "Maps Embed API" and to this site's address.
const GOOGLE_KEY = "AIzaSyA5Tvjuws5OrPiwo2-x79nhY-JnpI5y0Ms";
const PORTAL_URL = "https://jampa.maps.arcgis.com";
const LAYER_ITEM_ID = "92a0b1aa2c9f47efa0a06182c08a2ce1";   // Lockhart_CIP_Projects_Beta
const START = { center: [-97.670, 29.885], zoom: 13 };

const SYSTEM_COLORS = {
  "Water Distribution": "#1f78b4",
  "Water Supply & Wells": "#6a3d9a",
  "Wastewater Collection": "#e31a1c",
  "Wastewater Treatment": "#33a02c"
};

/* ----------------------------------------------------------------- helpers */
// Field names differ between versions of the layer, so look a value up by any of its names.
function pick(attrs, names) {
  const keys = Object.keys(attrs);
  for (const n of names) {
    const k = keys.find(k => k.toLowerCase() === n.toLowerCase());
    if (k && attrs[k] !== null && attrs[k] !== "" && attrs[k] !== undefined) return attrs[k];
  }
  return null;
}
const money = v => (typeof v === "number")
  ? v.toLocaleString("en-US", { style: "currency", currency: "USD", maximumFractionDigits: 0 }) : null;
const pct = v => (typeof v === "number") ? Math.round(v <= 1 ? v * 100 : v) + "%" : null;
function setText(id, value) {
  const el = document.getElementById(id);
  el.textContent = value || "";
  el.style.display = value ? "" : "none";
}

/* ---------------------------------------------------------------- site view */
const site = document.getElementById("site");
const btnFocus = document.getElementById("btn-focus");

function openSite(attrs, lat, lon) {
  const id = pick(attrs, ["Project_ID"]);
  setText("c-id", id);
  setText("c-system", pick(attrs, ["System"]));
  setText("c-status", pick(attrs, ["Status"]));
  setText("c-title", pick(attrs, ["Project_Type"]) || "Capital project");
  setText("c-desc", pick(attrs, ["Description"]));

  const facts = [
    ["Plan cost", money(pick(attrs, ["Plan_Cost_USD"]))],
    ["Cost range", (() => {
      const lo = money(pick(attrs, ["Cost_Low_USD"])), hi = money(pick(attrs, ["Cost_High_USD"]));
      return lo && hi ? lo + " – " + hi : null; })()],
    ["Needed by", pick(attrs, ["Horizon_Phase", "Plan_Horizon"])],
    ["Progress", pct(pick(attrs, ["Percent_Complete"]))],
    ["What triggers it", pick(attrs, ["Trigger_Text"])],
    ["Source", pick(attrs, ["Plan_Source"])]
  ].filter(f => f[1] !== null && f[1] !== undefined && f[1] !== "");
  const dl = document.getElementById("c-facts");
  dl.replaceChildren();
  for (const [k, v] of facts) {
    const dt = document.createElement("dt"); dt.textContent = k;
    const dd = document.createElement("dd"); dd.textContent = String(v);
    dl.append(dt, dd);
  }

  const conf = pick(attrs, ["Locate_Confidence", "Confidence"]);
  setText("c-note", "Location is approximate" + (conf ? " (" + conf.toLowerCase() + " confidence)" : "") +
    ". Street view shows the nearest available imagery, which may not face the work site.");

  const loc = lat.toFixed(6) + "," + lon.toFixed(6);
  const frame = document.getElementById("sv");
  const missing = document.getElementById("sv-missing");
  if (GOOGLE_KEY && !GOOGLE_KEY.startsWith("PASTE_")) {
    frame.src = "https://www.google.com/maps/embed/v1/streetview?key=" + encodeURIComponent(GOOGLE_KEY) +
      "&location=" + loc + "&fov=90";
    frame.style.display = ""; missing.style.display = "none";
  } else {
    frame.removeAttribute("src"); frame.style.display = "none";
    missing.textContent = "Street view needs a Google Maps Embed API key (see GOOGLE_KEY at the top of this file).";
    missing.style.display = "flex";
  }
  document.getElementById("btn-gmaps").href =
    "https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=" + loc;

  setFocus(false);
  site.classList.add("open");
  site.setAttribute("aria-hidden", "false");
  btnFocus.focus();
}

function setFocus(on) {
  site.classList.toggle("focus", on);
  btnFocus.textContent = on ? "Show project details" : "Focus street view";
  btnFocus.setAttribute("aria-pressed", String(on));
}
function closeSite() {
  site.classList.remove("open", "focus");
  site.setAttribute("aria-hidden", "true");
  document.getElementById("sv").removeAttribute("src");
}
btnFocus.addEventListener("click", () => setFocus(!site.classList.contains("focus")));
document.getElementById("btn-close").addEventListener("click", closeSite);
document.addEventListener("keydown", e => { if (e.key === "Escape" && site.classList.contains("open")) closeSite(); });

/* --------------------------------------------------------------------- map */
require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/widgets/Legend",
         "esri/widgets/Expand", "esri/widgets/Search"],
function (Map, MapView, FeatureLayer, Legend, Expand, Search) {
  const layer = new FeatureLayer({
    portalItem: { id: LAYER_ITEM_ID, portal: { url: PORTAL_URL } },
    outFields: ["*"],
    popupEnabled: false,
    renderer: {
      type: "unique-value",
      field: "System",
      legendOptions: { title: "System" },
      uniqueValueInfos: Object.entries(SYSTEM_COLORS).map(([value, color]) => ({
        value, label: value,
        symbol: { type: "simple-marker", size: 11, color, outline: { color: "white", width: 1.5 } }
      })),
      defaultSymbol: { type: "simple-marker", size: 11, color: "#777", outline: { color: "white", width: 1.5 } }
    }
  });

  const map = new Map({ basemap: "streets-navigation-vector", layers: [layer] });
  const view = new MapView({ container: "map", map, center: START.center, zoom: START.zoom,
                             popupEnabled: false });
  view.ui.move("zoom", "bottom-right");
  view.ui.add(new Expand({ view, content: new Legend({ view }), expanded: true }), "bottom-left");
  view.ui.add(new Search({ view }), "top-right");

  view.on("pointer-move", async (e) => {
    const hit = await view.hitTest(e, { include: [layer] });
    view.container.style.cursor = hit.results.length ? "pointer" : "";
  });

  view.on("click", async (e) => {
    const hit = await view.hitTest(e, { include: [layer] });
    if (!hit.results.length) return;
    const oid = hit.results[0].graphic.attributes[layer.objectIdField];
    // Ask for the point in latitude/longitude, whatever coordinate system the layer uses.
    const res = await layer.queryFeatures({
      objectIds: [oid], outFields: ["*"], returnGeometry: true, outSpatialReference: { wkid: 4326 }
    });
    const f = res.features[0];
    if (f) openSite(f.attributes, f.geometry.y, f.geometry.x);
  });
});
</script>
</body>
</html>
